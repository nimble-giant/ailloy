name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

jobs:
  gosec:
    name: Gosec Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: ./...

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # No GOTOOLCHAIN pin on purpose: setup-go above resolves the newest
        # 1.26.x patch, so the scanned stdlib picks up Go security releases
        # without a hand-edit here. A pinned floor went stale three times and
        # re-redded this required check on each Go patch release.
        run: govulncheck ./...
