enabled: true
targets:
  - claude
  - opencode
  - codex

output:
  blanks/AGENTS.md: AGENTS.md
  blanks/agents:
    - dest: .claude/agents
      set:
        current_target: claude
    - dest: .opencode/agents
      set:
        current_target: opencode
  blanks/codex-agents:
    dest: .codex/agents
    set:
      current_target: codex
  blanks/skills:
    - .claude/skills
    - .agents/skills
