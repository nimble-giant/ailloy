# agent_targets ore: the harness registry `targets:` output entries expand
# against. Each harness lists the project-relative surfaces it reads.
#
# Surfaces (the `targets:` value in a mold's output entry):
#   instructions  file  always-on project instructions (AGENTS.md, CLAUDE.md, ...)
#   agents        dir   subagent / custom-agent definitions
#   skills        dir   Agent Skills (<name>/SKILL.md)
#   commands      dir   slash commands / prompt files / workflows
#   rules         dir   scoped rule files
#   mcp           file  MCP server config (cast with strategy: merge)
#
# A surface is a destination string or {dest, ext, format, strategy}.
# `format` (default "markdown") is exposed to blanks as agent.format so one
# template can emit the right frontmatter; `ext` renames files written under
# a directory surface. Harnesses sharing a destination are written once.
#
# Formats used below:
#   markdown           Markdown + YAML frontmatter (name, description), Claude style
#   opencode           Markdown + YAML frontmatter, filename is the name (description, mode, model, permission)
#   codex-toml         Codex custom agent TOML (name, description, developer_instructions)
#   vibe-toml          Mistral Vibe agent TOML
#   copilot-agent      GitHub Copilot .agent.md (description required; tools, model)
#   copilot-prompt     GitHub Copilot .prompt.md (description, agent, model, tools)
#   copilot-instructions  .instructions.md with applyTo glob frontmatter
#   gemini-toml        Gemini / Qwen style command TOML (description, prompt)
#   kiro-json          Kiro / Amazon Q custom agent JSON (name, description, prompt, tools)
#   cursor-mdc         Cursor .mdc rule (description, globs, alwaysApply)
#   windsurf-rule      Markdown rule with trigger/globs/description frontmatter
#   kiro-steering      Markdown steering with inclusion/fileMatchPattern frontmatter
#   continue-rule      Markdown rule with name/globs/regex/alwaysApply frontmatter
#   augment-rule       Markdown rule with type/description frontmatter
#   paths-rule         Markdown rule with optional `paths:` glob frontmatter
#   mcp-json           JSON {"mcpServers": {...}}
#   vscode-mcp-json    JSON {"servers": {...}}
#   opencode-json      JSON {"mcp": {...}} (opencode.json / kilo.jsonc)
#   mcp-toml           TOML [mcp_servers.<name>] tables (Codex, Grok)
#   vibe-mcp-toml      TOML [[mcp_servers]] array (Mistral Vibe)
#
# Paths come from vendor docs and source as of 2026-10; see
# docs/agent-targets.md for sources and confidence.
enabled: true
targets:
  - claude
harnesses:
  # --- Terminal / CLI agents ---
  claude:
    name: Claude Code
    instructions: CLAUDE.md
    agents: .claude/agents
    skills: .claude/skills
    commands: .claude/commands
    rules: {dest: .claude/rules, format: paths-rule}
    mcp: {dest: .mcp.json, format: mcp-json, strategy: merge}
  codex:
    name: OpenAI Codex
    instructions: AGENTS.md
    agents: {dest: .codex/agents, ext: .toml, format: codex-toml}
